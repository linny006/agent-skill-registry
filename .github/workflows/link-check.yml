name: link-check

on:
  pull_request:
    paths: ["**.md"]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-redirects 5 './**/*.md'
          fail: false
